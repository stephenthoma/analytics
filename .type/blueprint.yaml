- name: lint-test-build
  contents: |
    Format/lint: mix format --check-formatted; mix credo; npm --prefix assets run lint (see .github/workflows/elixir.yml, node.yml).
    Backend tests: MIX_ENV=test mix test (needs Postgres + ClickHouse running; creates plausible_test DBs). CE variant: MIX_ENV=ce_test mix test.
    Dashboard tests: npm --prefix assets test. Tracker: npm --prefix tracker test (Playwright).
    E2E: npm --prefix e2e install && npx --prefix e2e playwright install && mix test.e2e.
    Compile check: mix compile --warnings-as-errors. Full suites were not run during environment setup.
- name: secrets-and-limits
  contents: |
    Required secrets: none for the dev workflow. Optional integrations (Google, Paddle, Postmark, MaxMind, Sentry, etc.) read env vars in config/runtime.exs and stay disabled when unset.
    Resource notes: first maintenance run ~8 min on 48 cores (mix deps.compile + compile dominate); seeding ~1 min. Root overlay is ~10 GB; tools + deps + data use ~3-4 GB.
    Optional services not set up: MinIO (imports/exports), SAML IdP (SSO), browserless. Use `make minio` etc. only if Docker is available.
